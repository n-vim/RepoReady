[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-ready"
version = "0.3.0"
description = "A Python CLI that prepares repositories with clean config files, workflows, and setup essentials."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Nitish Vimal" }
]
keywords = [
  "python",
  "cli",
  "repository",
  "configuration",
  "github",
  "developer-tools",
  "automation",
  "project-setup"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities"
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0",
  "PyYAML>=6.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0"
]

[project.urls]
Homepage = "https://github.com/n-vim/RepoReady"
Repository = "https://github.com/n-vim/RepoReady"
Issues = "https://github.com/n-vim/RepoReady/issues"

[project.scripts]
repoready = "repoready.cli:app"
repo-ready = "repoready.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/repoready"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "T20"]
ignore = ["UP006", "UP007", "T201"]

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true
